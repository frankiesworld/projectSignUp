<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Sign Up</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Agrave+Pro:wght@100..700&family=Faustina:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <div id="container">
        <div id="title">
            <h1>Thailand Beach Excursion<i class="fa-solid fa-umbrella-beach"></i></h1>
        </div>

        <div class="layout">
            <h2>Sign up now and enter for a chance to win a 7 day trip to Thailand!
                All it takes is to sign up and wait for your chance to WIN!
            </h2>
            <div>
                <fieldset>
                    <legend><h2>Test your luck?</h2></legend>
                <form action="https://www.example.com/signup" method="post">
                    <div class="field">
                        <label for="first_name">First Name</label>
                        <input type="text" name="first_name" id="first_name" placeholder="Frankie">
                    </div>
                    <div class="field">
                        <label for="last_name">Last Name</label>
                        <input type="text" name="last_name" id="last_name" placeholder="Lottie">
                    </div>
                    <div class="field">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="frankie@gmail.com">
                    </div>
                    <div class="field">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone" placeholder="123-456-7890">
                    </div>
                    <div class="field">
                        <label for="pass">Password</label>
                        <input type="password" id="pass" name="pass" placeholder="password123">
                    </div>
                    <div class="field">
                        <label for="confirmPass">Confirm Password</label>
                        <input type="password" id="confirmPass" name="confirmPass" placeholder="password123">
                    </div>
                    <div>
                        <button type="submit">Sign Up</button>
                        <p>already have an account?<a href="#">Login</a></p>
                    </div>
                </form>
                </fieldset>
            </div>
        </div>
    </div>


</body>
</html>
